# Configuration nginx : copier dans /etc/nginx/sites-available/dylanauto.fr
# puis : sudo ln -s /etc/nginx/sites-available/dylanauto.fr /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#        sudo certbot --nginx -d dylanauto.fr -d www.dylanauto.fr   (certificat HTTPS gratuit)
server {
    listen 80;
    server_name dylanauto.fr www.dylanauto.fr;

    client_max_body_size 20M;   # photos des demandes de devis

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
